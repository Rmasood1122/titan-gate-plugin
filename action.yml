name: "Titan Receipts — verify chain"
description: "Verify a repository's .titan/attestations/ receipt chain offline. Without a key: chain structure + content hashes (and says signatures were not checked). With the key secret: full signature verification."
branding:
  icon: shield
  color: gray-dark
inputs:
  key:
    description: "Hex signing key (pass a secret). Omit for structure-only verification."
    required: false
    default: ""
  report:
    description: "Path to write the markdown compliance report to (optional)."
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Verify receipt chain
      shell: bash
      env:
        TITAN_KEY: ${{ inputs.key }}
        TITAN_REPORT: ${{ inputs.report }}
      run: |
        set -euo pipefail
        TOOL="${GITHUB_ACTION_PATH}/core/receipt.py"
        if [ -f ".titan/tools/receipt.py" ]; then TOOL=".titan/tools/receipt.py"; fi
        rc=0
        if [ -n "$TITAN_KEY" ]; then
          mkdir -p .titan && printf '%s\n' "$TITAN_KEY" > .titan/key && chmod 600 .titan/key
          python3 "$TOOL" verify || rc=$?
        else
          python3 "$TOOL" verify --structure-only || rc=$?
        fi
        # The report is wanted MOST when verification fails — it records BROKEN.
        if [ -n "$TITAN_REPORT" ]; then
          python3 "$TOOL" report --out "$TITAN_REPORT" || true
        fi
        if [ -n "$TITAN_KEY" ]; then rm -f .titan/key; fi
        exit $rc
